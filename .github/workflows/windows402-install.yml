name: Probar instalador Windows 4.0.2

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  install-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir script real validado
        shell: powershell
        run: |
          $b64=(Get-Content .\realwin\miagenda_ps_test.zip.b64 -Raw).Trim()
          [IO.File]::WriteAllBytes((Join-Path $PWD 'script.zip'),[Convert]::FromBase64String($b64))
          $h=(Get-FileHash .\script.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne '341566f779133724e7934bab6be94842def6524c757ec9baeb8432da0ad33264'){throw "Script alterado $h"}
          New-Item -ItemType Directory -Path .\package -Force | Out-Null
          Expand-Archive .\script.zip -DestinationPath .\package -Force
          Copy-Item .\realwin402\1_INSTALAR_MiAgenda.cmd .\package\1_INSTALAR_MiAgenda.cmd -Force
      - name: Analizar sintaxis del script real
        shell: powershell
        run: |
          $text=Get-Content .\package\MiAgenda.ps1 -Raw
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseInput($text,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List *;throw 'Errores de sintaxis'}
      - name: Ejecutar instalador 4.0.2
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\package"
          call 1_INSTALAR_MiAgenda.cmd
          if errorlevel 1 exit /b %errorlevel%
      - name: Verificar instalación real
        shell: powershell
        run: |
          $app=Join-Path $env:LOCALAPPDATA 'MiAgenda-App'
          foreach($f in @('MiAgenda.ps1','ABRIR_MiAgenda.cmd','SINCRONIZAR_AHORA.cmd','DIAGNOSTICO_MiAgenda.cmd')){
            if(-not(Test-Path (Join-Path $app $f))){throw "Falta instalado: $f"}
          }
          powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File (Join-Path $app 'MiAgenda.ps1') -SyncOnly
          if($LASTEXITCODE -ne 0){throw "SyncOnly instalado fallo: $LASTEXITCODE"}
