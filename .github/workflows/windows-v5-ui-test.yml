name: Probar Mi Agenda Windows 5.0 UI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  windows-v5:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir Mi Agenda 5.0 exacta
        shell: powershell
        run: |
          $parts = 0..3 | ForEach-Object { Get-Content ('.\v5\gz\part{0:d2}.txt' -f $_) -Raw }
          $b64 = ($parts -join '').Trim()
          $gz = [Convert]::FromBase64String($b64)
          $in = New-Object IO.MemoryStream(,$gz)
          $zip = New-Object IO.Compression.GZipStream($in,[IO.Compression.CompressionMode]::Decompress)
          $out = New-Object IO.MemoryStream
          $zip.CopyTo($out)
          $bytes = $out.ToArray()
          $zip.Dispose(); $in.Dispose(); $out.Dispose()
          [IO.File]::WriteAllBytes((Join-Path $PWD 'v5\MiAgenda.ps1'),$bytes)
          $h=(Get-FileHash .\v5\MiAgenda.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne '4a936d27fdbdbd0988a54823117f773078076c1c3b8ec08db48b6a40e4a057f7'){ throw "SHA-256 no coincide: $h" }
          Write-Host "SHA-256 OK: $h"

      - name: Analizar sintaxis con Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\v5\MiAgenda.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){ $errors | Format-List *; throw 'Mi Agenda 5.0 contiene errores de sintaxis' }
          $raw=[IO.File]::ReadAllText((Resolve-Path '.\v5\MiAgenda.ps1'),[Text.Encoding]::UTF8)
          $bad=[regex]::Matches($raw,'\b(return|throw|continue|break)\$[A-Za-z_]')
          if($bad.Count -gt 0){ throw "Palabra reservada pegada a variable: $($bad[0].Value)" }
          Write-Host 'Sintaxis PowerShell 5.1: OK'

      - name: Probar motor y almacenamiento
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File .\v5\MiAgenda.ps1 -SyncOnly
          if($LASTEXITCODE -ne 0){ throw "SyncOnly falló: $LASTEXITCODE" }
          Write-Host 'Motor local: OK'

      - name: Abrir interfaz aprobada y comprobar estabilidad inicial
        shell: powershell
        run: |
          $out=Join-Path $PWD 'ui-out.txt'
          $err=Join-Path $PWD 'ui-err.txt'
          $p=Start-Process powershell.exe -ArgumentList @('-NoLogo','-NoProfile','-STA','-ExecutionPolicy','Bypass','-File',(Resolve-Path '.\v5\MiAgenda.ps1')) -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 12
          if($p.HasExited){
            Write-Host 'STDOUT:'; if(Test-Path $out){Get-Content $out}
            Write-Host 'STDERR:'; if(Test-Path $err){Get-Content $err}
            throw "La interfaz se cerró durante el arranque. Código: $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Interfaz Mi Agenda 5.0 permaneció abierta: OK'
