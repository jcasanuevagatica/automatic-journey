name: Compilar y probar Mi Agenda Android

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruir proyecto revisado
        shell: bash
        run: |
          : > project.zip.b64
          for f in $(find ci2 -maxdepth 1 -type f -name 'p*' | sort); do
            printf '%s ' "$f"
            tr -d '\r\n' < "$f" | sha256sum
            tr -d '\r\n' < "$f" >> project.zip.b64
          done
          echo "TAMANO=$(wc -c < project.zip.b64)"
          echo "196e7a4529291762a0fe8a47af465c22ec2669fe3c5f108ec194490db5233932  project.zip.b64" | sha256sum -c -
          base64 -d project.zip.b64 > project.zip
          echo "a58852c6560560af5f123fe811731247b3ad1dfc9e14c0db6caf813d469d5b5a  project.zip" | sha256sum -c -
          mkdir project
          unzip -q project.zip -d project

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificación estática de seguridad
        working-directory: project
        run: python3 tools/verify_project.py

      - name: Compilar APK real
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Verificar APK generado
        working-directory: project
        run: test -s app/build/outputs/apk/debug/app-debug.apk && sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Instalar y abrir en emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb install -r project/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n cl.miagenda.segura.debug/cl.miagenda.segura.MainActivity
            sleep 3
            test -n "$(adb shell pidof cl.miagenda.segura.debug | tr -d '\r')"
            adb shell dumpsys package cl.miagenda.segura.debug | grep -q "versionName=4.0.0-debug"

      - name: Publicar APK probada
        uses: actions/upload-artifact@v4
        with:
          name: MiAgenda-Android-APK-PROBADA
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
