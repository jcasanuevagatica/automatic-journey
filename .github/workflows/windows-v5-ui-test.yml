name: Probar Mi Agenda Windows 5.0 UI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  windows-v5:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir Mi Agenda 5.0 final exacta
        shell: powershell
        run: |
          $parts = 0..15 | ForEach-Object { Get-Content ('.\v5\reliable\p{0:d2}.txt' -f $_) -Raw }
          $b64 = ($parts -join '').Trim()
          $gz = [Convert]::FromBase64String($b64)
          $in = New-Object IO.MemoryStream(,$gz)
          $zip = New-Object IO.Compression.GZipStream($in,[IO.Compression.CompressionMode]::Decompress)
          $out = New-Object IO.MemoryStream
          $zip.CopyTo($out)
          $bytes = $out.ToArray()
          $zip.Dispose(); $in.Dispose(); $out.Dispose()
          [IO.File]::WriteAllBytes((Join-Path $PWD 'v5\MiAgenda.ps1'),$bytes)
          $h=(Get-FileHash .\v5\MiAgenda.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne 'de2f109fec91a9d5f99e00f59da8c2fdff198b3ec1f3a8f3d19dc4372d5178e8'){ throw "SHA-256 final no coincide: $h" }
          Write-Host "Mi Agenda 5.0 final SHA-256 OK: $h"

      - name: Analizar sintaxis con Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\v5\MiAgenda.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){
            foreach($e in $errors){ Write-Host ("L{0}:C{1} {2} :: {3}" -f $e.Extent.StartLineNumber,$e.Extent.StartColumnNumber,$e.Message,$e.Extent.Text) }
            throw 'Mi Agenda 5.0 contiene errores de sintaxis'
          }
          $raw=[IO.File]::ReadAllText((Resolve-Path '.\v5\MiAgenda.ps1'),[Text.Encoding]::UTF8)
          $bad=[regex]::Matches($raw,'\b(return|throw|continue|break)\$[A-Za-z_]')
          if($bad.Count -gt 0){ throw "Palabra reservada pegada a variable: $($bad[0].Value)" }
          Write-Host 'Sintaxis PowerShell 5.1: OK'

      - name: Probar motor cifrado y almacenamiento local
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File .\v5\MiAgenda.ps1 -SyncOnly
          if($LASTEXITCODE -ne 0){ throw "SyncOnly falló: $LASTEXITCODE" }
          Write-Host 'Motor local cifrado: OK'

      - name: Abrir interfaz aprobada y comprobar estabilidad inicial
        shell: powershell
        run: |
          $out=Join-Path $PWD 'ui-out.txt'
          $err=Join-Path $PWD 'ui-err.txt'
          $p=Start-Process powershell.exe -ArgumentList @('-NoLogo','-NoProfile','-STA','-ExecutionPolicy','Bypass','-File',(Resolve-Path '.\v5\MiAgenda.ps1')) -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 15
          if($p.HasExited){
            Write-Host 'STDOUT:'; if(Test-Path $out){Get-Content $out}
            Write-Host 'STDERR:'; if(Test-Path $err){Get-Content $err}
            throw "La interfaz se cerró durante el arranque. Código: $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Interfaz Mi Agenda 5.0 aprobada permaneció abierta: OK'

      - name: Preparar prueba de reemplazo seguro
        shell: powershell
        run: |
          $installerDir=Join-Path $PWD 'v5\installer'
          Copy-Item .\v5\MiAgenda.ps1 (Join-Path $installerDir 'MiAgenda.ps1') -Force
          $data=Join-Path $env:LOCALAPPDATA 'MiAgendaSegura'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $data 'preserve_marker.txt') -Value 'NO_BORRAR_DATOS' -Encoding ASCII
          $old=Join-Path $env:LOCALAPPDATA 'MiAgenda-App'
          New-Item -ItemType Directory -Path $old -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $old 'MiAgenda.ps1') -Value 'return$b' -Encoding ASCII
          Write-Host 'Instalación antigua defectuosa simulada y datos personales sembrados.'

      - name: Ejecutar instalador final 5.0
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\v5\installer"
          call 1_INSTALAR_MiAgenda_5.0.cmd
          if errorlevel 1 exit /b %errorlevel%

      - name: Verificar instalación y preservación de datos
        shell: powershell
        run: |
          $app=Join-Path $env:LOCALAPPDATA 'MiAgenda-App'
          $data=Join-Path $env:LOCALAPPDATA 'MiAgendaSegura'
          $file=Join-Path $app 'MiAgenda.ps1'
          if(-not(Test-Path $file)){throw 'No se instaló MiAgenda.ps1'}
          $h=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne 'de2f109fec91a9d5f99e00f59da8c2fdff198b3ec1f3a8f3d19dc4372d5178e8'){throw "Hash instalado incorrecto: $h"}
          if(Select-String -LiteralPath $file -SimpleMatch 'return$b'){throw 'La instalación conserva el error antiguo return$b'}
          foreach($f in @('ABRIR_MiAgenda.cmd','SINCRONIZAR_AHORA.cmd','DIAGNOSTICO_MiAgenda.cmd','DESINSTALAR_MiAgenda.cmd')){
            if(-not(Test-Path (Join-Path $app $f))){throw "Falta archivo instalado: $f"}
          }
          $marker=Join-Path $data 'preserve_marker.txt'
          if(-not(Test-Path $marker)){throw 'El instalador eliminó datos personales'}
          if((Get-Content $marker -Raw).Trim() -ne 'NO_BORRAR_DATOS'){throw 'El marcador de datos personales fue alterado'}
          powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File $file -SyncOnly
          if($LASTEXITCODE -ne 0){throw "La copia instalada falló SyncOnly: $LASTEXITCODE"}
          Write-Host 'Instalador final: hash, archivos, datos preservados y motor instalado OK.'
