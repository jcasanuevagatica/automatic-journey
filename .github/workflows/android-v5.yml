name: Compilar y probar Mi Agenda Android 5.0

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruir proyecto Android base verificado
        shell: bash
        run: |
          : > project.zip.b64
          for f in $(find ci2 -maxdepth 1 -type f -name 'p*' | sort); do
            tr -d '\r\n' < "$f" >> project.zip.b64
          done
          test "$(wc -c < project.zip.b64)" -eq 54556
          echo "196e7a4529291762a0fe8a47af465c22ec2669fe3c5f108ec194490db5233932  project.zip.b64" | sha256sum -c -
          base64 -d project.zip.b64 > project.zip
          echo "a58852c6560560af5f123fe811731247b3ad1dfc9e14c0db6caf813d469d5b5a  project.zip" | sha256sum -c -
          mkdir project
          unzip -q project.zip -d project

      - name: Aplicar MainActivity 5.0 exacta
        shell: bash
        run: |
          : > MainActivity.java.gz.b64
          for f in $(find v5/android-main -maxdepth 1 -type f -name 'p*' | sort); do
            tr -d '\r\n' < "$f" >> MainActivity.java.gz.b64
          done
          test "$(wc -c < MainActivity.java.gz.b64)" -eq 33384
          base64 -d MainActivity.java.gz.b64 > MainActivity.java.gz
          gzip -dc MainActivity.java.gz > project/app/src/main/java/cl/miagenda/segura/MainActivity.java
          echo "54debf6b213df74d39751b131b736c349f26fafb5f44256ffde21bcdebd06a66  project/app/src/main/java/cl/miagenda/segura/MainActivity.java" | sha256sum -c -
          sed -i 's/versionCode 40000/versionCode 50000/' project/app/build.gradle
          sed -i 's/versionName "4.0.0"/versionName "5.0.0"/' project/app/build.gradle
          grep -q 'versionCode 50000' project/app/build.gradle
          grep -q 'versionName "5.0.0"' project/app/build.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificación estática de seguridad
        working-directory: project
        run: python3 tools/verify_project.py

      - name: Compilar APK 5.0 real
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Verificar APK generado
        working-directory: project
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Instalar y abrir en emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb install -r project/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n cl.miagenda.segura.debug/cl.miagenda.segura.MainActivity
            sleep 6
            test -n "$(adb shell pidof cl.miagenda.segura.debug | tr -d '\r')"
            adb shell dumpsys package cl.miagenda.segura.debug | grep -q "versionName=5.0.0-debug"
            adb shell logcat -d -t 300 | grep -E "FATAL EXCEPTION|AndroidRuntime" && exit 1 || true

      - name: Publicar APK 5.0 probada
        uses: actions/upload-artifact@v4
        with:
          name: MiAgenda-Android-5.0-APK-PROBADA
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
